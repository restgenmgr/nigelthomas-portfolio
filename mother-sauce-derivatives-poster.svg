<svg viewBox="0 0 900 1400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect x="0" y="0" width="900" height="1400" fill="#0b0b0b"/>
  <rect x="0" y="0" width="900" height="7" fill="#d4af37"/>
  <rect x="0" y="1393" width="900" height="7" fill="#d4af37"/>

  <!-- Header -->
  <circle cx="90" cy="88" r="52" fill="#0b0b0b" stroke="#d4af37" stroke-width="3"/>
  <text x="90" y="100" font-size="34" font-weight="800" fill="#d4af37" text-anchor="middle">NT</text>

  <text x="470" y="66" font-size="40" font-weight="800" fill="#d4af37" text-anchor="middle" letter-spacing="1">MOTHER SAUCE</text>
  <text x="470" y="108" font-size="40" font-weight="800" fill="#d4af37" text-anchor="middle" letter-spacing="1">DERIVATIVES</text>
  <text x="470" y="136" font-size="15" fill="#cccccc" text-anchor="middle">The 5 Classical Mother Sauces &amp; Their Training Derivatives</text>
  <line x1="60" y1="160" x2="880" y2="160" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- ROW TEMPLATE VALUES -->
  <!-- Row 1: Bechamel -->
  <g>
    <rect x="40" y="185" width="820" height="190" rx="14" fill="#131313" stroke="#2c2c2c" stroke-width="1.5"/>
    <rect x="40" y="185" width="6" height="190" fill="#d4af37"/>
    <circle cx="100" cy="280" r="38" fill="#d4af37"/>
    <text x="100" y="292" font-size="34" font-weight="800" fill="#0b0b0b" text-anchor="middle">1</text>

    <text x="160" y="230" font-size="27" font-weight="800" fill="#d4af37">BÉCHAMEL — the white sauce</text>
    <text x="160" y="258" font-size="15" fill="#dddddd">Base: Milk &#8226; Thickening: White Roux</text>
    <text x="160" y="290" font-size="16" font-weight="800" fill="#f0cf5a">MNEMONIC: BMCN</text>
    <text x="160" y="318" font-size="16" fill="#eaeaea">Mornay &#8226; Mustard &#8226; Cheddar &#8226; Nantua</text>
    <text x="160" y="345" font-size="12.5" fill="#8f8f8f">Cheese, mustard, everyday cream &amp; classic shellfish-flavoured derivatives</text>
  </g>

  <!-- Row 2: Veloute -->
  <g>
    <rect x="40" y="400" width="820" height="190" rx="14" fill="#131313" stroke="#2c2c2c" stroke-width="1.5"/>
    <rect x="40" y="400" width="6" height="190" fill="#d4af37"/>
    <circle cx="100" cy="495" r="38" fill="#d4af37"/>
    <text x="100" y="507" font-size="34" font-weight="800" fill="#0b0b0b" text-anchor="middle">2</text>

    <text x="160" y="445" font-size="27" font-weight="800" fill="#d4af37">VELOUTÉ — the velvet sauce</text>
    <text x="160" y="473" font-size="15" fill="#dddddd">Base: Light Stock (chicken/veal/fish) &#8226; Thickening: Blonde Roux</text>
    <text x="160" y="505" font-size="16" font-weight="800" fill="#f0cf5a">MNEMONIC: ASB</text>
    <text x="160" y="533" font-size="16" fill="#eaeaea">Allemande &#8226; Suprême &#8226; Bercy</text>
    <text x="160" y="560" font-size="12.5" fill="#8f8f8f">Egg-yolk enriched, poultry-based &amp; classic training references</text>
  </g>

  <!-- Row 3: Espagnole -->
  <g>
    <rect x="40" y="615" width="820" height="190" rx="14" fill="#131313" stroke="#2c2c2c" stroke-width="1.5"/>
    <rect x="40" y="615" width="6" height="190" fill="#d4af37"/>
    <circle cx="100" cy="710" r="38" fill="#d4af37"/>
    <text x="100" y="722" font-size="34" font-weight="800" fill="#0b0b0b" text-anchor="middle">3</text>

    <text x="160" y="660" font-size="27" font-weight="800" fill="#d4af37">ESPAGNOLE — the brown sauce</text>
    <text x="160" y="688" font-size="15" fill="#dddddd">Base: Brown Stock &#8226; Thickening: Brown Roux &#8226; Reduction</text>
    <text x="160" y="720" font-size="16" font-weight="800" fill="#f0cf5a">MNEMONIC: BCMD</text>
    <text x="160" y="748" font-size="16" fill="#eaeaea">Bordelaise &#8226; Chasseur &#8226; Madeira &#8226; Demi-glace</text>
    <text x="160" y="775" font-size="12.5" fill="#8f8f8f">Wine, mushroom &amp; concentrated-reduction derivatives</text>
  </g>

  <!-- Row 4: Tomato -->
  <g>
    <rect x="40" y="830" width="820" height="190" rx="14" fill="#131313" stroke="#2c2c2c" stroke-width="1.5"/>
    <rect x="40" y="830" width="6" height="190" fill="#d4af37"/>
    <circle cx="100" cy="925" r="38" fill="#d4af37"/>
    <text x="100" y="937" font-size="34" font-weight="800" fill="#0b0b0b" text-anchor="middle">4</text>

    <text x="160" y="875" font-size="27" font-weight="800" fill="#d4af37">TOMATO — the red sauce</text>
    <text x="160" y="903" font-size="15" fill="#dddddd">Base: Tomato + Aromatics &#8226; Method: Reduction</text>
    <text x="160" y="935" font-size="16" font-weight="800" fill="#f0cf5a">MNEMONIC: CPP</text>
    <text x="160" y="963" font-size="16" fill="#eaeaea">Creole &#8226; Portuguese &#8226; Provençale</text>
    <text x="160" y="990" font-size="12.5" fill="#8f8f8f">Regional, herb-and-garlic driven Mediterranean-style variations</text>
  </g>

  <!-- Row 5: Hollandaise -->
  <g>
    <rect x="40" y="1045" width="820" height="190" rx="14" fill="#131313" stroke="#2c2c2c" stroke-width="1.5"/>
    <rect x="40" y="1045" width="6" height="190" fill="#d4af37"/>
    <circle cx="100" cy="1140" r="38" fill="#d4af37"/>
    <text x="100" y="1152" font-size="34" font-weight="800" fill="#0b0b0b" text-anchor="middle">5</text>

    <text x="160" y="1090" font-size="27" font-weight="800" fill="#d4af37">HOLLANDAISE — the emulsion sauce</text>
    <text x="160" y="1118" font-size="15" fill="#dddddd">Base: Egg Yolk + Clarified Butter &#8226; Method: Warm Emulsion</text>
    <text x="160" y="1150" font-size="16" font-weight="800" fill="#f0cf5a">MNEMONIC: BMCM</text>
    <text x="160" y="1178" font-size="16" fill="#eaeaea">Béarnaise &#8226; Maltaise &#8226; Choron &#8226; Mousseline</text>
    <text x="160" y="1205" font-size="12.5" fill="#8f8f8f">Herb, citrus, tomato &amp; whipped-cream aerated variations</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="1260" x2="880" y2="1260" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="470" y="1300" font-size="22" font-weight="800" fill="#d4af37" text-anchor="middle" letter-spacing="1">NIGEL A. THOMAS</text>
  <text x="470" y="1322" font-size="13" fill="#cccccc" text-anchor="middle" letter-spacing="2">HOSPITALITY EXECUTIVE &amp; CORPORATE TRAINER</text>
  <text x="470" y="1362" font-size="14" fill="#d4af37" text-anchor="middle">www.nigelthomas.live</text>
</svg>
