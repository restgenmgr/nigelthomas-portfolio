{"@type":"Question","name":"What does KPI stand for?","acceptedAnswer":{"@type":"Answer","text":"Key Performance Indicator — a measurable value that shows how effectively a business is achieving a specific goal."}},
{"@type":"Question","name":"What's the difference between a KPI and a metric?","acceptedAnswer":{"@type":"Answer","text":"Every KPI is a metric, but not every metric is a KPI. A metric is any number you can measure. A KPI is a metric that has been deliberately chosen because it is tied to a goal and someone is accountable for acting on it."}},
{"@type":"Question","name":"Which KPI should a new manager start with?","acceptedAnswer":{"@type":"Answer","text":"Food Cost and Labour Cost. Together they cover the two largest and most controllable expense lines in almost any restaurant, and both respond quickly to operational changes a new manager can make in the first few weeks."}},
{"@type":"Question","name":"How often should restaurant KPIs be reviewed?","acceptedAnswer":{"@type":"Answer","text":"Financial and operational KPIs like Food Cost, Beverage Cost and Labour Cost are best reviewed weekly. Guest Satisfaction can be reviewed on a rolling basis as feedback comes in, with a deeper review monthly."}},
{"@type":"Question","name":"Can a restaurant have too many KPIs?","acceptedAnswer":{"@type":"Answer","text":"Yes. A dashboard with 30 numbers nobody checks is worse than one with 8 that get reviewed every week. Start with the core set and only add more once the first ones are a genuine habit."}}
